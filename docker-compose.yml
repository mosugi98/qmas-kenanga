# Server sendiri (VPS): HTTPS otomatis lewat Caddy.
#   1. cp .env.example .env   lalu isi DOMAIN dan TOKOEMAS_SETUP_TOKEN
#   2. arahkan DNS domain ke IP server, lalu: docker compose up -d
#   3. buka https://DOMAIN/setup, masukkan token, buat akun pemilik
services:
  app:
    image: ghcr.io/mosugi98/qmas-kenanga:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TOKOEMAS_ONLINE: "1"
      TOKOEMAS_DATA: /data
    volumes:
      - qmas-data:/data
    expose:
      - "8000"          # tidak dipublikasikan ke luar; hanya Caddy yang bisa menjangkaunya

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  qmas-data:
  caddy-data:
  caddy-config:
